[project]
name = "payoptimize"
version = "0.1.0"
description = "AI-powered payment orchestration: route every payment to the provider most likely to authorize it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payoptimize"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
